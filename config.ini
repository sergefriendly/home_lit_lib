[app]
# Режим: dev / test / prod. Перекрывается переменной окружения LIBRARY_ENV.
env = dev

[ui]
# Размер страницы при просмотре и в статистике: 15 / 30 / 50 / 100
page_size = 30

[data]
# Путь к CSV относительно корня проекта (или абсолютный)
csv_path = books.csv

[export]
# Папка для отчётов и выгрузок. ~ раскрывается в домашнюю папку пользователя.
# Папка должна существовать — иначе программа остановится с ошибкой.
export_dir = ~/Загрузки

[web]
# Адрес и порт веб-сервера. Перекрываются переменными окружения WEB_HOST / WEB_PORT.
host = 127.0.0.1
port = 8001